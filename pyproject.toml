[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-property-lakehouse"
version = "0.1.0"
description = "South African property lakehouse: tenant trading and interest rates"
requires-python = ">=3.12"
dependencies = [
  # DuckDB 2.0.0 returned wrong results after a bulk insert in nyc-taxi-pipeline.
  "duckdb>=1.1,<2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=15",
  "dbt-core>=1.10,<2",
  "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
# PySpark matches Glue 5.0, which runs Spark 3.5.4.
dev = ["pytest>=8", "ruff>=0.6", "pyspark==3.5.4"]
# botocore[crt] lets dbt use credentials from `aws login`.
cloud = ["dbt-athena>=1.9", "botocore[crt]"]

[tool.setuptools.packages.find]
include = ["ingestion*", "processing*", "transform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
