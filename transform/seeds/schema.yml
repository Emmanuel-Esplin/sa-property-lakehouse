version: 2

seeds:
  - name: retail_categories
    description: Stats SA retailer types, with this project's defensive and discretionary judgement.
    columns:
      - name: category
        data_tests: [not_null, unique]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [defensive, discretionary, mixed, total]

  - name: reits
    description: >
      The JSE REITs the project tracks, with this project's judgement of each one's main sector.
      A landed file with a ticker that isn't listed here is refused.
    columns:
      - name: ticker
        data_tests: [not_null, unique]
      - name: sector
        data_tests:
          - accepted_values:
              arguments:
                values: [retail, logistics, office, diversified, specialist]
