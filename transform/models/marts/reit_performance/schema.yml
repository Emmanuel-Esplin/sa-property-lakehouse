version: 2

models:
  - name: mart_rates_monthly
    description: >
      Month-end policy (repo) and prime rates, the monthly average long government bond yield,
      repo changes and an approximate real bond yield. The latest, incomplete month is excluded.
    data_tests:
      - no_month_gaps:
          partition_by: []
    columns:
      - name: month
        data_tests: [not_null, unique]
      - name: repo_rate_pct
        data_tests: [not_null]
      - name: prime_rate_pct
        data_tests: [not_null]
      - name: bond_10y_plus_yield_pct
        data_tests: [not_null]

  - name: mart_reit_monthly
    description: >
      Month-end price, distributions, monthly price and total return, and trailing 12-month
      distribution yield for each REIT, beside prime and the long bond yield.
    data_tests:
      - unique_combination:
          columns: [month, ticker]
      - no_month_gaps:
          partition_by: [ticker]
    columns:
      - name: close_cents
        data_tests: [not_null]

  - name: mart_reit_returns
    description: Annualised 3- and 5-year total returns per REIT, nominal and after CPI.
    columns:
      - name: ticker
        data_tests: [not_null, unique]

  - name: mart_sector_rate_sensitivity
    description: Each sector's monthly total return in months with policy rate hikes, cuts and holds.
    columns:
      - name: sector
        data_tests: [not_null, unique]
